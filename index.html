<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何数据展示工具 - 百度地图修复版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #baidu-container {
            width: 100%;
            height: 100%;
        }
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 420px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            z-index: 10;
            max-height: 95vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background: linear-gradient(135deg, #3388FF, #4A90E2);
            color: white;
            padding: 18px 20px;
            border-radius: 12px 12px 0 0;
            margin: 0;
            position: sticky;
            top: 0;
            z-index: 11;
            flex-shrink: 0;
        }
        .panel-header h3 {
            margin: 0;
            font-size: 20px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .panel-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 0;
            background: white;
            z-index: 10;
            flex-shrink: 0;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }
        .tab {
            flex: 1;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            color: #666;
        }
        .tab.active {
            border-bottom: 3px solid #3388FF;
            color: #3388FF;
            background-color: #f8fbff;
        }
        .current-tab-indicator {
            background: #e7f3ff;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 0;
            font-size: 14px;
            border-left: 4px solid #3388FF;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .current-tab-indicator::before {
            content: "📍";
            font-size: 16px;
        }
        .action-buttons {
            background: white;
            padding: 0 0 12px 0;
            margin: 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-button-group {
            display: flex;
            gap: 10px;
            margin: 0;
        }
        .main-button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: #3388FF;
            color: white;
        }
        .btn-primary:hover {
            background: #297acc;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(51, 136, 255, 0.3);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(108, 117, 125, 0.3);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }
        .btn-warning {
            background: #ffc107;
            color: #212529;
        }
        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 193, 7, 0.3);
        }
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 12px;
        }
        .tab-content.active {
            display: flex;
        }
        .format-indicator {
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
            border-left: 4px solid #28a745;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .format-indicator::before {
            content: "📋";
        }
        .format-indicator.wkt {
            border-left-color: #3388FF;
        }
        .format-indicator.coords {
            border-left-color: #28a745;
        }
        .input-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .input-item textarea {
            width: 100%;
            flex: 1;
            min-height: 320px;
            margin: 0;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            box-sizing: border-box;
            line-height: 1.6;
            transition: border 0.3s;
        }
        .input-item textarea:focus {
            border-color: #3388FF;
            outline: none;
            box-shadow: 0 0 0 2px rgba(51, 136, 255, 0.2);
        }
        .format-example {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
            flex-shrink: 0;
            padding: 0 4px;
        }
        .legend {
            padding: 14px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            border-top: 1px solid #eee;
            margin-top: 10px;
        }
        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-title::before {
            content: "🎨";
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
        }
        .legend-color {
            width: 20px;
            height: 4px;
            margin-right: 8px;
            border-radius: 2px;
        }
        .legend-point {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .legend-line {
            background-color: #3388FF;
        }
        .legend-polygon {
            background-color: #FF0000;
        }
        .legend-point-color {
            background-color: #28a745;
        }
        .status-message {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        @media (max-width: 768px) {
            .control-panel {
                width: calc(100% - 40px);
                max-height: 85vh;
            }
            .input-item textarea {
                min-height: 250px;
            }
            .panel-content {
                gap: 12px;
            }
            .main-button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="baidu-container"></div>

    <div class="control-panel">
        <div class="panel-header">
            <h3>几何数据展示工具（百度地图修复版）</h3>
        </div>
        <div class="panel-content">
            <div class="tabs">
                <div class="tab" data-tab="points">点数据</div>
                <div class="tab" data-tab="lines">线数据</div>
                <div class="tab active" data-tab="polygons">多边形数据</div>
            </div>
            <div class="current-tab-indicator" id="current-tab-indicator">
                当前选中: <strong>多边形数据</strong>
            </div>
            <div class="action-buttons">
                <div class="main-button-group">
                    <button class="btn-success" id="show-current-btn">
                        <span>🔍</span> 显示当前图形
                    </button>
                    <button class="btn-primary" id="show-all-btn">
                        <span>🗺️</span> 显示所有图形
                    </button>
                    <button class="btn-secondary" id="clear-all-btn">
                        <span>🗑️</span> 清除所有
                    </button>
                </div>
            </div>

            <div class="tab-content" id="points-tab">
                <div class="format-indicator" id="points-format-indicator">检测到格式: <strong>坐标串</strong></div>
                <div class="input-item">
                    <textarea id="points-input" placeholder="点数据...">116.404,39.915;116.405,39.916</textarea>
                </div>
            </div>

            <div class="tab-content" id="lines-tab">
                <div class="format-indicator" id="lines-format-indicator">检测到格式: <strong>坐标串</strong></div>
                <div class="input-item">
                    <textarea id="lines-input" placeholder="线数据...">116.404,39.915;116.405,39.916|116.406,39.917;116.407,39.918</textarea>
                </div>
            </div>

            <div class="tab-content active" id="polygons-tab">
                <div class="format-indicator" id="polygon-format-indicator">检测到格式: <strong>坐标串</strong></div>
                <div class="input-item">
                    <textarea id="polygon-input">116.403151,39.911163;116.403910,39.911171;116.403905,39.912015;116.404663,39.912023;116.404650,39.912405;116.404350,39.912618;116.404202,39.912615;116.404139,39.912577;116.404143,39.912674;116.404089,39.912840;116.404040,39.913057;116.403047,39.912997;116.403151,39.911163</textarea>
                </div>
                <div class="format-example">✅ 首尾点相同，已闭合</div>
            </div>

            <div class="status-message" id="status-message"></div>

            <div class="legend">
                <div class="legend-title">图例说明</div>
                <div class="legend-item"><div class="legend-point legend-point-color"></div><span>点数据</span></div>
                <div class="legend-item"><div class="legend-color legend-line"></div><span>线数据</span></div>
                <div class="legend-item"><div class="legend-color legend-polygon"></div><span>多边形数据（高亮红）</span></div>
            </div>
        </div>
    </div>

    <!-- 百度地图 API -->
    <script src="//api.map.baidu.com/api?v=1.0&type=webgl&ak=vzz9Wpy0k1X3D7zFW04sf7xBLxhR6iRx"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let baiduMap;
            let layers = { points: [], lines: [], polygons: [] };

            // ✅ 修复：稳健的 viewport 定位（自动缩放到最佳级别）
            function fitBoundsToData(points) {
                if (!points || points.length === 0) return;
                const bPoints = points.map(p => new BMapGL.Point(p[0], p[1]));
                const viewport = baiduMap.getViewport(bPoints, {
                    zoomFactor: -0.3,
                    enableAnimation: true
                });
                baiduMap.setViewport(viewport.center, viewport.zoom);
            }

            function initBaiduMap() {
                baiduMap = new BMapGL.Map("baidu-container");
                baiduMap.centerAndZoom(new BMapGL.Point(116.404, 39.915), 16);
                baiduMap.enableScrollWheelZoom(true);
                console.log('✅ 百度地图初始化完成');
            }

            // ✅ 高亮样式：更醒目
            const POLYGON_STYLE = {
                fillColor: '#FF0000',
                fillOpacity: 0.5,
                strokeColor: '#CC0000',
                strokeWeight: 3,
                strokeOpacity: 0.9
            };

            function showPolygonsBaidu(polygons) {
                layers.polygons.forEach(p => baiduMap.removeOverlay(p));
                layers.polygons = [];
                if (polygons.length === 0) return;
                const allPoints = [];
                polygons.forEach(rings => {
                    const outerRing = rings[0];
                    const bPoints = outerRing.map(p => new BMapGL.Point(p[0], p[1]));
                    const polygon = new BMapGL.Polygon(bPoints, POLYGON_STYLE);
                    baiduMap.addOverlay(polygon);
                    layers.polygons.push(polygon);
                    allPoints.push(...outerRing);
                });
                fitBoundsToData(allPoints);
            }

            // ———— 其他辅助函数（精简复用）————
            function parsePolygonsFromCoords(input) {
                const polygons = [];
                input.split('|').forEach(polyStr => {
                    const pts = polyStr.split(';').map(s => {
                        const [lng, lat] = s.split(',').map(x => parseFloat(x.trim()));
                        return isNaN(lng) || isNaN(lat) ? null : [lng, lat];
                    }).filter(p => p);
                    if (pts.length >= 3) {
                        if (pts[0][0] !== pts[pts.length-1][0] || pts[0][1] !== pts[pts.length-1][1]) {
                            pts.push([...pts[0]]);
                        }
                        polygons.push([pts]);
                    }
                });
                return polygons;
            }

            function showCurrent() {
                const tab = 'polygons';
                const input = document.getElementById('polygon-input').value.trim();
                try {
                    const data = parsePolygonsFromCoords(input);
                    showPolygonsBaidu(data);
                    showStatus(`✅ 成功显示 ${data.length} 个多边形`, true);
                } catch (e) {
                    showStatus('❌ 解析失败: ' + e.message, false);
                }
            }

            function clearAll() {
                Object.values(layers).flat().forEach(ov => baiduMap.removeOverlay(ov));
                layers = { points: [], lines: [], polygons: [] };
                showStatus('🧹 已清除所有图形', true);
            }

            function showStatus(msg, ok) {
                const el = document.getElementById('status-message');
                el.textContent = msg;
                el.className = 'status-message ' + (ok ? 'status-success' : 'status-error');
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 3000);
            }

            // ———— 初始化 ————
            initBaiduMap();

            // ✅ 页面加载后自动显示你的多边形 👇
            setTimeout(() => {
                showCurrent();
                showStatus('🎯 已自动定位并显示你的多边形', true);
            }, 800);

            // 按钮绑定
            document.getElementById('show-current-btn').onclick = showCurrent;
            document.getElementById('show-all-btn').onclick = () => {
                showCurrent(); // 仅多边形示例；你可扩展点/线
                showStatus('✅ 显示全部（当前仅多边形）', true);
            };
            document.getElementById('clear-all-btn').onclick = clearAll;

            console.log('🚀 修复版已就绪：自动定位 + 高亮多边形');
        });
    </script>
</body>
</html>
