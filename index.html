<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何数据展示工具 - 百度地图版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #baidu-container {
            width: 100%;
            height: 100%;
        }
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 420px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            z-index: 10;
            max-height: 95vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background: linear-gradient(135deg, #3388FF, #4A90E2);
            color: white;
            padding: 18px 20px;
            border-radius: 12px 12px 0 0;
            margin: 0;
            position: sticky;
            top: 0;
            z-index: 11;
            flex-shrink: 0;
        }
        .panel-header h3 {
            margin: 0;
            font-size: 20px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .panel-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 0;
            background: white;
            z-index: 10;
            flex-shrink: 0;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }
        .tab {
            flex: 1;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            color: #666;
        }
        .tab.active {
            border-bottom: 3px solid #3388FF;
            color: #3388FF;
            background-color: #f8fbff;
        }
        .current-tab-indicator {
            background: #e7f3ff;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 0;
            font-size: 14px;
            border-left: 4px solid #3388FF;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .current-tab-indicator::before {
            content: "📍";
            font-size: 16px;
        }
        .action-buttons {
            background: white;
            padding: 0 0 12px 0;
            margin: 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-button-group {
            display: flex;
            gap: 10px;
            margin: 0;
        }
        .main-button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: #3388FF;
            color: white;
        }
        .btn-primary:hover {
            background: #297acc;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(51, 136, 255, 0.3);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(108, 117, 125, 0.3);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }
        .btn-warning {
            background: #ffc107;
            color: #212529;
        }
        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 193, 7, 0.3);
        }
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 12px;
        }
        .tab-content.active {
            display: flex;
        }
        .format-indicator {
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
            border-left: 4px solid #28a745;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .format-indicator::before {
            content: "📋";
        }
        .format-indicator.wkt {
            border-left-color: #3388FF;
        }
        .format-indicator.coords {
            border-left-color: #28a745;
        }
        .input-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .input-item textarea {
            width: 100%;
            flex: 1;
            min-height: 320px;
            margin: 0;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            box-sizing: border-box;
            line-height: 1.6;
            transition: border 0.3s;
        }
        .input-item textarea:focus {
            border-color: #3388FF;
            outline: none;
            box-shadow: 0 0 0 2px rgba(51, 136, 255, 0.2);
        }
        .format-example {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
            flex-shrink: 0;
            padding: 0 4px;
        }
        .legend {
            padding: 14px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            border-top: 1px solid #eee;
            margin-top: 10px;
        }
        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-title::before {
            content: "🎨";
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
        }
        .legend-color {
            width: 20px;
            height: 4px;
            margin-right: 8px;
            border-radius: 2px;
        }
        .legend-point {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .legend-line {
            background-color: #3388FF;
        }
        .legend-polygon {
            background-color: #FF6B6B;
        }
        .legend-point-color {
            background-color: #28a745;
        }
        .status-message {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        @media (max-width: 768px) {
            .control-panel {
                width: calc(100% - 40px);
                max-height: 85vh;
            }
            .input-item textarea {
                min-height: 250px;
            }
            .panel-content {
                gap: 12px;
            }
            .main-button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 百度地图容器 -->
    <div id="baidu-container"></div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="panel-header">
            <h3>几何数据展示工具（百度地图）</h3>
        </div>
        <div class="panel-content">
            <!-- 标签导航 - 多边形数据默认激活 -->
            <div class="tabs">
                <div class="tab" data-tab="points">点数据</div>
                <div class="tab" data-tab="lines">线数据</div>
                <div class="tab active" data-tab="polygons">多边形数据</div>
            </div>
            <!-- 当前选中指示器 -->
            <div class="current-tab-indicator" id="current-tab-indicator">
                当前选中: <strong>多边形数据</strong>
            </div>
            <!-- 操作按钮 -->
            <div class="action-buttons">
                <div class="main-button-group">
                    <button class="btn-success" id="show-current-btn">
                        <span>🔍</span> 显示当前图形
                    </button>
                    <button class="btn-primary" id="show-all-btn">
                        <span>🗺️</span> 显示所有图形
                    </button>
                    <button class="btn-secondary" id="clear-all-btn">
                        <span>🗑️</span> 清除所有
                    </button>
                </div>
            </div>
            <!-- 点数据标签页 -->
            <div class="tab-content" id="points-tab">
                <div class="format-indicator" id="points-format-indicator">
                    检测到格式: <strong>坐标串</strong>
                </div>
                <div class="input-item">
                    <textarea id="points-input" placeholder="请输入点数据，支持以下格式：
坐标串格式示例:
116.123,39.456;116.124,39.457
WKT格式示例:
POINT(116.123 39.456)
MULTIPOINT((116.123 39.456),(116.124 39.457))">116.404,39.915;116.405,39.916;116.406,39.917</textarea>
                </div>
                <div class="format-example">
                    提示: 点数据支持坐标串(经度,纬度;经度,纬度)和WKT(POINT/MULTIPOINT)格式
                </div>
            </div>
            <!-- 线数据标签页 -->
            <div class="tab-content" id="lines-tab">
                <div class="format-indicator" id="lines-format-indicator">
                    检测到格式: <strong>坐标串</strong>
                </div>
                <div class="input-item">
                    <textarea id="lines-input" placeholder="请输入线数据，支持以下格式：
坐标串格式示例:
116.123,39.456;116.124,39.457|116.125,39.458;116.126,39.459
WKT格式示例:
LINESTRING(116.123 39.456,116.124 39.457)
MULTILINESTRING((116.123 39.456,116.124 39.457),(116.125 39.458,116.126 39.459))">116.404,39.915;116.405,39.916;116.406,39.917|116.407,39.918;116.408,39.919</textarea>
                </div>
                <div class="format-example">
                    提示: 线数据支持坐标串(使用|分隔不同线段)和WKT(LINESTRING/MULTILINESTRING)格式
                </div>
            </div>
            <!-- 多边形数据标签页 - 默认激活 -->
            <div class="tab-content active" id="polygons-tab">
                <div class="format-indicator" id="polygon-format-indicator">
                    检测到格式: <strong>坐标串</strong>
                </div>
                <div class="input-item">
                    <textarea id="polygon-input" placeholder="请输入多边形数据，支持以下格式：
坐标串格式示例:
116.123,39.456;116.124,39.457;116.125,39.458;116.123,39.456
WKT格式示例:
POLYGON((116.123 39.456,116.124 39.457,116.125 39.458,116.123 39.456))
MULTIPOLYGON(((116.123 39.456,116.124 39.457,116.125 39.458,116.123 39.456)))">116.403151,39.911163;116.403910,39.911171;116.403905,39.912015;116.404663,39.912023;116.404650,39.912405;116.404350,39.912618;116.404202,39.912615;116.404139,39.912577;116.404143,39.912674;116.404089,39.912840;116.404040,39.913057;116.403047,39.912997;116.403151,39.911163</textarea>
                </div>
                <div class="format-example">
                    提示: 多边形数据支持坐标串(首尾坐标需相同以闭合)和WKT(POLYGON/MULTIPOLYGON)格式
                </div>
            </div>
            <!-- 状态消息 -->
            <div class="status-message" id="status-message"></div>
            <!-- 图例 -->
            <div class="legend">
                <div class="legend-title">图例说明</div>
                <div class="legend-item">
                    <div class="legend-point legend-point-color"></div>
                    <span>点数据</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-line"></div>
                    <span>线数据</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-polygon"></div>
                    <span>多边形数据</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 百度地图脚本 -->
    <script src="//api.map.baidu.com/api?v=1.0&type=webgl&ak=vzz9Wpy0k1X3D7zFW04sf7xBLxhR6iRx"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let baiduMap;
            let layers = { points: [], lines: [], polygons: [] };

            // 初始化百度地图
            function initBaiduMap() {
                baiduMap = new BMapGL.Map("baidu-container");
                baiduMap.centerAndZoom(new BMapGL.Point(116.404, 39.915), 16);
                baiduMap.enableScrollWheelZoom(true);
                baiduMap.setTilt(0);
                baiduMap.setHeading(0);
                console.log('百度地图初始化完成');
            }

            // 标签切换功能
            function initTabs() {
                const tabs = document.querySelectorAll('.tab');
                const tabContents = document.querySelectorAll('.tab-content');
                const indicator = document.getElementById('current-tab-indicator');
                tabs.forEach(tab => {
                    tab.addEventListener('click', function () {
                        const tabName = this.getAttribute('data-tab');
                        console.log('切换到标签:', tabName);
                        // 更新标签状态
                        tabs.forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        // 更新内容显示
                        tabContents.forEach(content => {
                            content.classList.remove('active');
                            if (content.id === `${tabName}-tab`) {
                                content.classList.add('active');
                            }
                        });
                        // 更新指示器
                        indicator.innerHTML = `当前选中: <strong>${this.textContent}</strong>`;
                    });
                });
            }

            // 自动检测格式的函数
            function detectFormat(input, type) {
                if (!input || input.trim() === '') return 'unknown';
                var text = input.trim().toUpperCase();
                // WKT格式检测
                if (type === 'points') {
                    if (text.startsWith('MULTIPOINT') || text.startsWith('POINT')) return 'wkt';
                } else if (type === 'lines') {
                    if (text.startsWith('MULTILINESTRING') || text.startsWith('LINESTRING')) return 'wkt';
                } else if (type === 'polygons') {
                    if (text.startsWith('MULTIPOLYGON') || text.startsWith('POLYGON')) return 'wkt';
                }
                // 坐标串格式检测
                if (input.includes(';')) {
                    var parts = input.split(';');
                    var validCoords = parts.some(part => {
                        var coords = part.split(',');
                        if (coords.length === 2) {
                            var lng = parseFloat(coords[0]), lat = parseFloat(coords[1]);
                            return !isNaN(lng) && !isNaN(lat);
                        }
                        return false;
                    });
                    if (validCoords) return 'coords';
                }
                return 'unknown';
            }

            // 更新格式指示器
            function updateFormatIndicator(tab, format) {
                const indicator = document.getElementById(`${tab}-format-indicator`);
                if (format === 'wkt') {
                    indicator.innerHTML = '检测到格式: <strong>WKT</strong>';
                    indicator.className = 'format-indicator wkt';
                } else if (format === 'coords') {
                    indicator.innerHTML = '检测到格式: <strong>坐标串</strong>';
                    indicator.className = 'format-indicator coords';
                } else {
                    indicator.innerHTML = '检测到格式: <strong>未知</strong>';
                    indicator.className = 'format-indicator';
                }
            }

            // 解析函数 —— 与原版一致
            function parsePointsFromCoords(input) {
                const points = [];
                const pointStrings = input.split(';');
                pointStrings.forEach(pointStr => {
                    const parts = pointStr.split(',');
                    if (parts.length >= 2) {
                        const lng = parseFloat(parts[0]);
                        const lat = parseFloat(parts[1]);
                        if (!isNaN(lng) && !isNaN(lat)) {
                            points.push([lng, lat]);
                        }
                    }
                });
                return points;
            }

            function parsePointsFromWKT(input) {
                const points = [];
                const cleaned = input.replace(/POINT|MULTIPOINT|\(|\)/g, '').trim();
                const coords = cleaned.split(',');
                coords.forEach(coord => {
                    const parts = coord.trim().split(/\s+/);
                    if (parts.length >= 2) {
                        const lng = parseFloat(parts[0]);
                        const lat = parseFloat(parts[1]);
                        if (!isNaN(lng) && !isNaN(lat)) {
                            points.push([lng, lat]);
                        }
                    }
                });
                return points;
            }

            function parseLinesFromCoords(input) {
                const lines = [];
                const lineStrings = input.split('|');
                lineStrings.forEach(lineStr => {
                    const points = [];
                    const pointStrings = lineStr.split(';');
                    pointStrings.forEach(pointStr => {
                        const parts = pointStr.split(',');
                        if (parts.length >= 2) {
                            const lng = parseFloat(parts[0]);
                            const lat = parseFloat(parts[1]);
                            if (!isNaN(lng) && !isNaN(lat)) {
                                points.push([lng, lat]);
                            }
                        }
                    });
                    if (points.length > 0) {
                        lines.push(points);
                    }
                });
                return lines;
            }

            function parseLinesFromWKT(input) {
                const lines = [];
                const cleaned = input.replace(/LINESTRING|MULTILINESTRING/g, '').trim();
                const lineStrings = cleaned.split(/\)\s*,\s*\(/);
                lineStrings.forEach(lineStr => {
                    const points = [];
                    const coordStr = lineStr.replace(/[()]/g, '');
                    const coords = coordStr.split(',');
                    coords.forEach(coord => {
                        const parts = coord.trim().split(/\s+/);
                        if (parts.length >= 2) {
                            const lng = parseFloat(parts[0]);
                            const lat = parseFloat(parts[1]);
                            if (!isNaN(lng) && !isNaN(lat)) {
                                points.push([lng, lat]);
                            }
                        }
                    });
                    if (points.length > 0) {
                        lines.push(points);
                    }
                });
                return lines;
            }

            function parsePolygonsFromCoords(input) {
                const polygons = [];
                const polygonStrings = input.split('|');
                polygonStrings.forEach(polygonStr => {
                    const points = [];
                    const pointStrings = polygonStr.split(';');
                    pointStrings.forEach(pointStr => {
                        const parts = pointStr.split(',');
                        if (parts.length >= 2) {
                            const lng = parseFloat(parts[0]);
                            const lat = parseFloat(parts[1]);
                            if (!isNaN(lng) && !isNaN(lat)) {
                                points.push([lng, lat]);
                            }
                        }
                    });
                    if (points.length >= 3) {
                        const firstPoint = points[0];
                        const lastPoint = points[points.length - 1];
                        if (firstPoint[0] !== lastPoint[0] || firstPoint[1] !== lastPoint[1]) {
                            points.push([firstPoint[0], firstPoint[1]]);
                        }
                        polygons.push([points]);
                    }
                });
                return polygons;
            }

            function parsePolygonsFromWKT(input) {
                const polygons = [];
                const cleaned = input.replace(/POLYGON|MULTIPOLYGON/g, '').trim();
                const polygonStrings = cleaned.split(/\)\s*,\s*\(/);
                polygonStrings.forEach(polygonStr => {
                    const rings = [];
                    const ringStrings = polygonStr.split(/\),\s*\(/);
                    ringStrings.forEach(ringStr => {
                        const points = [];
                        const coordStr = ringStr.replace(/[()]/g, '');
                        const coords = coordStr.split(',');
                        coords.forEach(coord => {
                            const parts = coord.trim().split(/\s+/);
                            if (parts.length >= 2) {
                                const lng = parseFloat(parts[0]);
                                const lat = parseFloat(parts[1]);
                                if (!isNaN(lng) && !isNaN(lat)) {
                                    points.push([lng, lat]);
                                }
                            }
                        });
                        if (points.length >= 3) {
                            const firstPoint = points[0];
                            const lastPoint = points[points.length - 1];
                            if (firstPoint[0] !== lastPoint[0] || firstPoint[1] !== lastPoint[1]) {
                                points.push([firstPoint[0], firstPoint[1]]);
                            }
                            rings.push(points);
                        }
                    });
                    if (rings.length > 0) {
                        polygons.push(rings);
                    }
                });
                return polygons;
            }

            // 百度地图显示函数（保持与原版一致）
            function showPointsBaidu(points) {
                layers.points.forEach(p => baiduMap.removeOverlay(p));
                layers.points = [];
                if (points.length === 0) return;
                points.forEach(point => {
                    const marker = new BMapGL.Marker(new BMapGL.Point(point[0], point[1]));
                    baiduMap.addOverlay(marker);
                    layers.points.push(marker);
                });
                fitBoundsToData(points, 'point');
            }

            function showLinesBaidu(lines) {
                layers.lines.forEach(l => baiduMap.removeOverlay(l));
                layers.lines = [];
                if (lines.length === 0) return;
                const allPoints = [];
                lines.forEach(linePoints => {
                    const bPoints = linePoints.map(p => new BMapGL.Point(p[0], p[1]));
                    const polyline = new BMapGL.Polyline(bPoints, {
                        strokeColor: '#3388FF',
                        strokeWeight: 4,
                        strokeOpacity: 0.8
                    });
                    baiduMap.addOverlay(polyline);
                    layers.lines.push(polyline);
                    allPoints.push(...linePoints);
                });
                fitBoundsToData(allPoints, 'point');
            }

            function showPolygonsBaidu(polygons) {
                layers.polygons.forEach(p => baiduMap.removeOverlay(p));
                layers.polygons = [];
                if (polygons.length === 0) return;
                const allPoints = [];
                polygons.forEach(polygonRings => {
                    const bPoints = polygonRings[0].map(p => new BMapGL.Point(p[0], p[1]));
                    const polygon = new BMapGL.Polygon(bPoints, {
                        fillColor: '#FF6B6B',
                        fillOpacity: 0.4,
                        strokeColor: '#FF6B6B',
                        strokeWeight: 2,
                        strokeOpacity: 0.8
                    });
                    baiduMap.addOverlay(polygon);
                    layers.polygons.push(polygon);
                    allPoints.push(...polygonRings[0]);
                });
                fitBoundsToData(allPoints, 'point');
            }

            function fitBoundsToData(points, type) {
                if (!points || points.length === 0) return;
                const bounds = new BMapGL.Bounds();
                points.forEach(point => {
                    bounds.extend(new BMapGL.Point(point[0], point[1]));
                });
                baiduMap.setViewport([bounds.getSouthWest(), bounds.getNorthEast()]);
            }

            function showCurrent() {
                const activeTab = document.querySelector('.tab.active').getAttribute('data-tab');
                const input = document.getElementById(`${activeTab}-input`).value.trim();
                if (!input) {
                    showStatus(`${getTabName(activeTab)}输入为空`, false);
                    return;
                }
                const format = detectFormat(input, activeTab);
                updateFormatIndicator(activeTab, format);
                try {
                    let data = [];
                    if (format === 'coords') {
                        if (activeTab === 'points') {
                            data = parsePointsFromCoords(input);
                            showPointsBaidu(data);
                            showStatus(`成功显示 ${data.length} 个点`, true);
                        } else if (activeTab === 'lines') {
                            data = parseLinesFromCoords(input);
                            showLinesBaidu(data);
                            showStatus(`成功显示 ${data.length} 条线`, true);
                        } else if (activeTab === 'polygons') {
                            data = parsePolygonsFromCoords(input);
                            showPolygonsBaidu(data);
                            showStatus(`成功显示 ${data.length} 个多边形`, true);
                        }
                    } else if (format === 'wkt') {
                        if (activeTab === 'points') {
                            data = parsePointsFromWKT(input);
                            showPointsBaidu(data);
                            showStatus(`成功显示 ${data.length} 个点`, true);
                        } else if (activeTab === 'lines') {
                            data = parseLinesFromWKT(input);
                            showLinesBaidu(data);
                            showStatus(`成功显示 ${data.length} 条线`, true);
                        } else if (activeTab === 'polygons') {
                            data = parsePolygonsFromWKT(input);
                            showPolygonsBaidu(data);
                            showStatus(`成功显示 ${data.length} 个多边形`, true);
                        }
                    } else {
                        showStatus('无法识别的数据格式，请使用坐标串或WKT格式', false);
                    }
                } catch (error) {
                    showStatus('解析错误: ' + error.message, false);
                    console.error('解析错误:', error);
                }
            }

            function showAll() {
                clearAll();
                ['points', 'lines', 'polygons'].forEach(tab => {
                    const input = document.getElementById(`${tab}-input`).value.trim();
                    if (!input) return;
                    const format = detectFormat(input, tab);
                    try {
                        let data = [];
                        if (format === 'coords') {
                            if (tab === 'points') data = parsePointsFromCoords(input);
                            else if (tab === 'lines') data = parseLinesFromCoords(input);
                            else if (tab === 'polygons') data = parsePolygonsFromCoords(input);
                        } else if (format === 'wkt') {
                            if (tab === 'points') data = parsePointsFromWKT(input);
                            else if (tab === 'lines') data = parseLinesFromWKT(input);
                            else if (tab === 'polygons') data = parsePolygonsFromWKT(input);
                        }
                        if (tab === 'points') showPointsBaidu(data);
                        else if (tab === 'lines') showLinesBaidu(data);
                        else if (tab === 'polygons') showPolygonsBaidu(data);
                    } catch (e) {
                        console.error(`解析${tab}数据错误：`, e);
                    }
                });
                showStatus('已显示所有图形数据', true);
            }

            function clearAll() {
                layers.points.forEach(p => baiduMap.removeOverlay(p));
                layers.lines.forEach(l => baiduMap.removeOverlay(l));
                layers.polygons.forEach(p => baiduMap.removeOverlay(p));
                layers = { points: [], lines: [], polygons: [] };
                showStatus('已清除所有图形', true);
            }

            function getTabName(tab) {
                const names = { points: '点数据', lines: '线数据', polygons: '多边形数据' };
                return names[tab] || tab;
            }

            function showStatus(message, isSuccess) {
                const el = document.getElementById('status-message');
                el.textContent = message;
                el.className = 'status-message ' + (isSuccess ? 'status-success' : 'status-error');
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 5000);
            }

            function initFormatDetection() {
                ['points', 'lines', 'polygons'].forEach(tab => {
                    const inputElement = document.getElementById(`${tab}-input`);
                    inputElement.addEventListener('input', function () {
                        const format = detectFormat(this.value, tab);
                        updateFormatIndicator(tab, format);
                    });
                    const format = detectFormat(inputElement.value, tab);
                    updateFormatIndicator(tab, format);
                });
            }

            function initEventListeners() {
                document.getElementById('show-current-btn').addEventListener('click', showCurrent);
                document.getElementById('show-all-btn').addEventListener('click', showAll);
                document.getElementById('clear-all-btn').addEventListener('click', clearAll);
            }

            // 启动
            initBaiduMap();
            initTabs();
            initFormatDetection();
            initEventListeners();

            console.log('精简版（仅百度地图）初始化完成');
        });
    </script>
</body>
</html>
